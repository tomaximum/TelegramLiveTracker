name: Telegram Live Tracker Bot Runner

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durée de fonctionnement en heures (max 6)'
        required: true
        default: '6'
  schedule:
    # Run every 30 minutes to check if there is an active event scheduled
    - cron: '*/30 * * * *'

concurrency:
  group: live-tracker-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_MANUAL_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          MANUAL_DURATION: ${{ github.event.inputs.duration || '6' }}
        run: |
          # Set a timeout for the runner based on user input
          TIMEOUT_MINUTES=$(( ${{ github.event.inputs.duration || 6 }} * 60 ))
          echo "Démarrage du Bot Telegram (Manuel: $IS_MANUAL_TRIGGER)..."
          
          timeout "${TIMEOUT_MINUTES}m" node bot.js || echo "Arrêt du bot."
